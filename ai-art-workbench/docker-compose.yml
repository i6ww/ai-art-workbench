# 推荐生产用法：Nginx 提供静态页，API 单独进应用容器，避免生成长任务拖死首页。
# 启动：在项目根目录执行  docker compose up -d --build
# 访问：http://服务器IP:8080  （仅对外暴露 web）

services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8080"
      # 仅处理 /api，可适当提高并发；内存紧张时可改为 32～48
      WAITRESS_THREADS: "64"
      # 异步任务 worker 并发，建议 <= WAITRESS_THREADS
      GENERATE_WORKERS: "24"
      # 排队上限，超过即快速返回 429，避免服务拖死
      MAX_PENDING_JOBS: "300"
    expose:
      - "8080"
    # 不映射端口到宿主机，只给内部 Nginx 访问

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./image.png:/usr/share/nginx/html/image.png:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
